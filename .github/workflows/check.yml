name: Check

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["src/**", "tests/**", ".github/workflows/check.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Roomy -c Release
      - run: dotnet test tests/Roomy.Tests -c Release
