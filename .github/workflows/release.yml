name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build portable and installed editions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'Inno Setup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Unexpected signature on the Inno Setup compiler.'
          }
          $setup = Start-Process -FilePath $download -ArgumentList @('/PORTABLE=1', "/DIR=`"$compiler`"", '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES', '/SP-', '/TASKS=') -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Inno Setup compiler setup failed.' }
          & ./tools/build-windows.ps1 -InnoCompiler (Join-Path $compiler 'ISCC.exe') -Version $env:RELEASE_TAG.TrimStart('v')

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG artifacts/windows/Roomy-Setup.exe artifacts/windows/Roomy-Portable.exe --generate-notes --title "Roomy $env:RELEASE_TAG"
          } else {
            gh release upload $env:RELEASE_TAG artifacts/windows/Roomy-Setup.exe artifacts/windows/Roomy-Portable.exe --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
